{% extends "base.html" %}
{% block title %}{{ t('app.title') }} – {{ t('intro.title') }}{% endblock %}
{% block content %}
<section class="intro">
  <h1>{{ t('intro.title') }}</h1>
  <p>{{ t('intro.subtitle') }}</p>
  <div class="toolbar">
    <button id="refresh-btn" class="btn" hx-post="/refresh" hx-swap="none">{{ t('btn.refresh') }}</button>
    <span id="refresh-feedback" class="refresh-feedback muted" aria-live="polite"></span>
    <div class="filter-wrap">
      <input class="filter" type="search" placeholder="{{ t('filter.placeholder') }}" oninput="patchwatchFilter()">
      <button type="button" class="filter-clear" hidden aria-label="{{ t('filter.clear') }}" onclick="patchwatchClearFilter()">×</button>
    </div>
    <div class="hidden-panel-wrap">
      <button type="button" class="btn btn-secondary" onclick="patchwatchToggleHiddenPanel()">
        {{ t('nav.hidden') }} (<span id="hidden-count">0</span>)
      </button>
      <div id="hidden-panel" class="hidden-panel" hidden></div>
    </div>
  </div>
</section>

<div id="tables" hx-get="/partials/tables" hx-trigger="patchwatch-refreshed from:body" hx-swap="innerHTML">
  {% include "partials/all_tables.html" %}
</div>
{% endblock %}
