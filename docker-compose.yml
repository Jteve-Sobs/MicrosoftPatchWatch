services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patchwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchwatch}
      POSTGRES_DB: ${POSTGRES_DB:-patchwatch}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patchwatch} -d ${POSTGRES_DB:-patchwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-patchwatch}:${POSTGRES_PASSWORD:-patchwatch}@db:5432/${POSTGRES_DB:-patchwatch}
      FETCH_INTERVAL_HOURS: ${FETCH_INTERVAL_HOURS:-6}
      FETCH_ON_STARTUP: ${FETCH_ON_STARTUP:-true}
      MIN_REFRESH_INTERVAL_MINUTES: ${MIN_REFRESH_INTERVAL_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"

  # Optional: lightweight DB browser for the patch history, http://localhost:8081
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8080"

  # Automatic pg_dump backups with rotation, written to ./backups/ as plain
  # gzip'd .sql.gz files (readable by any Postgres restore, not tied to this
  # image). See README "Backups" for restore instructions.
  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-patchwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchwatch}
      POSTGRES_DB: ${POSTGRES_DB:-patchwatch}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-12}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
    volumes:
      - ./backups:/backups

volumes:
  db_data:
